<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000428"/>
      <stop offset="100%" stop-color="#004e92"/>
    </linearGradient>
  </defs>
  <style>
    .s { fill: #ffffff; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    .shootA { animation: shootA 8s linear infinite; }
    .shootB { animation: shootB 12s linear infinite; animation-delay: 5s; }
    @keyframes shootA {
      0%   { transform: translate(1150px, 25px); opacity: 0; }
      1%   { opacity: 1; }
      7%   { transform: translate(650px, 150px); opacity: 0; }
      100% { transform: translate(650px, 150px); opacity: 0; }
    }
    @keyframes shootB {
      0%   { transform: translate(880px, 12px); opacity: 0; }
      1%   { opacity: 1; }
      6%   { transform: translate(430px, 125px); opacity: 0; }
      100% { transform: translate(430px, 125px); opacity: 0; }
    }
  </style>

  <rect width="1200" height="200" fill="url(#sky)"/>

  <g>
    <circle class="s" cx="30"   cy="25"  r="1.4" style="animation-duration:2.6s;animation-delay:-0.4s"/>
    <circle class="s" cx="85"   cy="60"  r="1.0" style="animation-duration:3.4s;animation-delay:-1.7s"/>
    <circle class="s" cx="120"  cy="15"  r="1.8" style="animation-duration:2.2s;animation-delay:-0.9s"/>
