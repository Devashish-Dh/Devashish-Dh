    <circle class="s" cx="320"  cy="110" r="0.8" style="animation-duration:4.5s;animation-delay:-0.7s"/>
    <circle class="s" cx="360"  cy="55"  r="1.3" style="animation-duration:3.1s;animation-delay:-2.8s"/>
    <circle class="s" cx="400"  cy="15"  r="1.6" style="animation-duration:2.7s;animation-delay:-1.4s"/>
