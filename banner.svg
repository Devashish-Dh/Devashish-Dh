  <g class="shootA">
    <line x1="0" y1="0" x2="70" y2="-21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <circle r="2.4" fill="#ffffff"/>
  </g>
  <g class="shootB">
    <line x1="0" y1="0" x2="55" y2="-16" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <circle r="1.9" fill="#ffffff"/>
  </g>

  <text x="600" y="115" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="46" font-weight="600" fill="#ffffff"
        letter-spacing="1">Devashish Dhaulakhandi</text>
</svg>
