<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000106"/>
      <stop offset="100%" stop-color="#001535"/>
    </linearGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .s { fill: #ffffff; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    .shootA { animation: shootA 8s linear infinite; }
    .shootB { animation: shootB 12s linear infinite; animation-delay: 5s; }
    @keyframes shootA {
      0%   { transform: translate(1150px, 20px); opacity: 0; }
      1%   { opacity: 1; }
      7%   { transform: translate(700px, 110px); opacity: 0; }
      100% { transform: translate(700px, 110px); opacity: 0; }
    }
    @keyframes shootB {
      0%   { transform: translate(880px, 12px); opacity: 0; }
      1%   { opacity: 1; }
      6%   { transform: translate(480px, 105px); opacity: 0; }
      100% { transform: translate(480px, 105px); opacity: 0; }
    }
    .w1 { animation: drift1 9s ease-in-out infinite; }
    .w2 { animation: drift2 12s ease-in-out infinite; }
    .w3 { animation: drift3 7s ease-in-out infinite; }
    @keyframes drift1 { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-38px); } }
    @keyframes drift2 { 0%, 100% { transform: translateX(-30px); } 50% { transform: translateX(10px); } }
    @keyframes drift3 { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(30px); } }
  </style>

  <rect width="1200" height="200" fill="url(#sky)"/>

