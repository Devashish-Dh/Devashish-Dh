<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 70" width="800" height="70">
  <style>
    .node { fill: #58a6ff; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .link {
      stroke: #58a6ff; stroke-width: 1; opacity: .35; fill: none;
      stroke-dasharray: 6 6;
      animation: drift 6s linear infinite;
    }
    @keyframes drift { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -48; } }
  </style>

