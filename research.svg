  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .d { animation: wave 6.12s linear infinite; }
    @keyframes wave { 0% { opacity: .10; } 4% { opacity: 1; } 14% { opacity: .10; } 100% { opacity: .10; } }
    .cometA { animation: cometA 6.12s linear infinite; }
    .cometB { animation: cometB 6.12s linear infinite; }
    @keyframes cometA {
      0%   { transform: translate(-30px, -20px); opacity: 0; }
      4%   { opacity: 1; }
      40%  { transform: translate(930px, 170px); opacity: 0; }
      100% { transform: translate(930px, 170px); opacity: 0; }
    }
    @keyframes cometB {
      0%   { transform: translate(930px, -20px); opacity: 0; }
      55%  { transform: translate(930px, -20px); opacity: 0; }
      59%  { opacity: 1; }
      95%  { transform: translate(-30px, 170px); opacity: 0; }
      100% { transform: translate(-30px, 170px); opacity: 0; }
    }
  </style>

